[package]
name = "ticket_tracker"
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "ACME Inc. ticket board: a desktop window (wry/WebView2) running a Rust/WebAssembly UI over the shared ACME database."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlSelectElement",
  "HtmlTextAreaElement", "HtmlDialogElement", "HtmlFormElement", "Event", "EventTarget", "Location",
  "Request", "RequestInit", "RequestMode", "Response", "Headers", "DomStringMap", "console",
] }

# The desktop program (cargo build --release --features desktop): a native window hosting the wasm page,
# serving it and a small hub-compatible API from the shared SQLite file. Off by default, so wasm-pack and
# plain `cargo test` never compile these.
[target.'cfg(windows)'.dependencies]
wry = { version = "0.57", optional = true }
tao = { version = "0.37", optional = true }
rusqlite = { version = "0.40", features = ["bundled"], optional = true }

[features]
desktop = ["dep:wry", "dep:tao", "dep:rusqlite"]

[[bin]]
name = "acme-tickets"
path = "src/main.rs"
required-features = ["desktop"]

[profile.release]
opt-level = "s"
lto = true
